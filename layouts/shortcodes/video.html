{{ $src := .Get "src" }}
{{ $video := resources.Get (strings.TrimPrefix "/" $src) }}
{{ if $video }}
<video src="{{ $video.RelPermalink }}" autoplay muted loop playsinline style="width:100%;height:auto;display:block;"></video>
{{ else }}
<video src="{{ $src | safeURL }}" autoplay muted loop playsinline style="width:100%;height:auto;display:block;"></video>
{{ end }}
